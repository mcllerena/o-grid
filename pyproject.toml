[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "o-grid"
version = "0.1.0"
description = "Open power system modeling and optimization framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcllerena", email = "mcllerena@users.noreply.github.com" }]
maintainers = [
  { name = "mcllerena", email = "mcllerena@users.noreply.github.com" },
]
dependencies = [
  "infrasys>=1.2.0,<2.0.0",
  "loguru>=0.7.3,<1.0.0",
  "numpy>=2.0",
  "pydantic>=2.11.0,<3.0.0",
  "pyomo>=6.10.1",
  "r2x-core>=0.4.0,<1.0.0",
  "rust-ok>=0.3.0,<1.0.0",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "ipython>=8.32.0",
  "prek>=0.2.28",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.12.0",
  "ty>=0.0.1a19",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=o_grid --cov-report=term-missing --cov-fail-under=95"

[tool.ty.environment]
python-version = "3.11"
python-platform = "Windows"

[tool.hatch.build.targets.wheel]
packages = ["src/o_grid"]

[tool.hatch.build.targets.sdist]
include = ["/src/o_grid", "/tests", "/README.md", "/LICENSE"]
