[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "o-grid"
version = "0.1.0"
description = "Open power system modeling and optimization framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "o-grid contributors" }]
dependencies = ["infrasys>=1.2.0", "pyomo>=6.10.1"]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.12.0", "ty>=0.0.1a19"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=o_grid --cov-report=term-missing:skip-covered --cov-fail-under=95"

[tool.ty.environment]
python-version = "3.11"
python-platform = "Windows"

[tool.hatch.build.targets.wheel]
packages = ["src/o_grid"]

[tool.hatch.build.targets.sdist]
include = ["/src/o_grid", "/tests", "/README.md", "/LICENSE"]
